#art{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--art-img,none) center 18%/cover no-repeat;opacity:var(--art-op);filter:var(--art-filter);-webkit-mask-image:radial-gradient(ellipse 95% 62% at 50% 22%,#000 15%,transparent 78%);mask-image:radial-gradient(ellipse 95% 62% at 50% 22%,#000 15%,transparent 78%);transition:opacity .5s}
body.no-art #art{display:none}
#deco{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:.9;background:var(--deco-top) center env(safe-area-inset-top,0px)/100% auto no-repeat,var(--deco-bot) center calc(100% - var(--nav) - var(--safe-b))/100% auto no-repeat,var(--deco-l) left top/42px auto repeat-y,var(--deco-r) right top/42px auto repeat-y;-webkit-mask-image:radial-gradient(ellipse 74% 64% at 50% 48%,transparent 55%,#000 92%);mask-image:radial-gradient(ellipse 74% 64% at 50% 48%,transparent 55%,#000 92%)}
body.scrolled #deco,body.scrolled #decoAnim{opacity:.55}
body:has(.sheet-back) #deco,body:has(.sheet-back) #decoAnim{opacity:.35}
/* Bewegte Rand-Details (Inline-SVG über den statischen Rändern) */
#decoAnim{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:.9;-webkit-mask-image:radial-gradient(ellipse 74% 64% at 50% 48%,transparent 55%,#000 92%);mask-image:radial-gradient(ellipse 74% 64% at 50% 48%,transparent 55%,#000 92%)}
#decoAnim svg{position:absolute;left:0;width:100%;height:auto;overflow:visible}
#decoAnim .da-top{top:env(safe-area-inset-top,0px)}
#decoAnim .da-bot{bottom:calc(var(--nav) + var(--safe-b))}
@media(min-width:700px){#decoAnim svg{width:620px;left:50%;margin-left:-310px}}
#decoAnim [class^=a-],#decoAnim [class*=' a-']{transform-box:fill-box;animation-duration:var(--d,4s);animation-delay:var(--dl,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out}
#decoAnim .a-sway{transform-origin:50% 100%;animation-name:dsway}
#decoAnim .a-sway.slow{animation-name:dsways}
#decoAnim .a-nod{transform-origin:50% 100%;animation-name:dnod}
#decoAnim .a-tilt{transform-origin:50% 90%;animation-name:dtilt}
#decoAnim .a-blink{transform-origin:50% 50%;animation-name:dblink}
#decoAnim .a-flap{transform-origin:50% 60%;animation-name:dflap}
#decoAnim .a-flapv{transform-origin:50% 50%;animation-name:dflapv}
#decoAnim .a-bob{animation-name:dbob}
#decoAnim .a-flicker{transform-origin:50% 100%;animation-name:dflick}
#decoAnim .a-spin{transform-origin:50% 50%;animation-name:dspin;animation-timing-function:linear}
#decoAnim .a-spin.rev{animation-direction:reverse}
#decoAnim .a-swim{animation-name:dswim;animation-timing-function:linear}
#decoAnim .a-swim.rev{animation-name:dswimr}
#decoAnim .a-drift{animation-name:ddrift;animation-direction:alternate}
#decoAnim .a-curl{transform-origin:0% 100%;animation-name:dcurl}
#decoAnim .a-curl.rev{transform-origin:100% 100%;animation-name:dcurlr}
#decoAnim .a-flutter{transform-origin:50% 0%;animation-name:dflut}
#decoAnim .a-swing{transform-origin:50% 0%;animation-name:dswing}
#decoAnim .a-pulse{transform-origin:50% 50%;animation-name:dpulse}
#decoAnim .a-jaw{animation-name:djaw}
#decoAnim .a-zap{animation-name:dzap}
@keyframes dsway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
@keyframes dsways{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes dnod{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-9deg)}75%{transform:rotate(4deg)}85%{transform:rotate(-6deg)}}
@keyframes dtilt{0%,40%,100%{transform:rotate(0)}50%,62%{transform:rotate(-14deg)}72%,82%{transform:rotate(10deg)}}
@keyframes dblink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes dflap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.45)}}
@keyframes dflapv{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@keyframes dbob{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-4px)}50%{transform:translate(0,-7px)}75%{transform:translate(-3px,-3px)}}
@keyframes dflick{0%,100%{transform:scale(1,1)}20%{transform:scale(.94,1.08)}45%{transform:scale(1.05,.9)}70%{transform:scale(.97,1.12)}}
@keyframes dspin{to{transform:rotate(360deg)}}
@keyframes dswim{0%{transform:translateX(0)}100%{transform:translateX(470px)}}
@keyframes dswimr{0%{transform:translateX(0)}100%{transform:translateX(-470px)}}
@keyframes ddrift{0%{transform:translateX(0)}100%{transform:translateX(-110px)}}
@keyframes dcurl{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes dcurlr{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-6deg)}}
@keyframes dflut{0%,100%{transform:skewX(0) scaleY(1)}25%{transform:skewX(-7deg) scaleY(.97)}75%{transform:skewX(6deg) scaleY(1.02)}}
@keyframes dswing{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes dpulse{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
@keyframes djaw{0%,70%,100%{transform:translateY(0)}74%,82%{transform:translateY(2.5px)}78%,86%{transform:translateY(0)}}
@keyframes dzap{0%,40%,58%,100%{opacity:0}42%,47%,52%{opacity:1}44%,50%{opacity:.2}}
body.no-fx #decoAnim *{animation:none!important}
@media (prefers-reduced-motion:reduce){#decoAnim *{animation:none!important}}
@media(min-width:700px){#deco{background-size:620px auto,620px auto,70px auto,70px auto;background-position:center env(safe-area-inset-top,0px),center calc(100% - var(--nav)),left top,right top}}
main{position:relative;z-index:1}
/* Inhalte leicht durchscheinend, damit Rand & Kunst durchschimmern */
.panel,.sugg,.frow,.crow,.erow,.seg,.fchip{background:color-mix(in srgb,var(--card) 84%,transparent)}
.stat{background:color-mix(in srgb,var(--bg2) 82%,transparent)}
.fchip.on{background:var(--gold-bg)}
/* Feinschliff je Design */
[data-theme=green] .panel,[data-theme=green] .sugg{box-shadow:inset 0 1px 0 rgba(205,229,143,.07),0 6px 18px rgba(0,0,0,.25)}
[data-theme=black] .panel,[data-theme=black] .sugg,[data-theme=black] .stat{box-shadow:0 0 0 1px #000,0 8px 22px rgba(0,0,0,.6)}
[data-theme=black] h3{letter-spacing:.12em;font-size:13px}
[data-theme=black] .stat b{font-family:'Pirata One',serif;font-size:24px;font-weight:400;color:#efe9dc}
[data-theme=black] .btn.primary{text-transform:uppercase;letter-spacing:.08em;font-weight:800}
[data-theme=black] .group h3,[data-theme=black] .crow .n{color:#c22a2a}
[data-theme=black] h1,[data-theme=black] h2{font-weight:400}
[data-theme=ub] h3{text-transform:uppercase;letter-spacing:.14em;font-size:13px}
[data-theme=ub] .panel,[data-theme=ub] .sugg{box-shadow:0 0 0 1px rgba(78,201,192,.06),0 10px 24px rgba(0,0,0,.5)}
[data-theme=red] .panel,[data-theme=red] .sugg{border-top-color:rgba(255,140,60,.35)}
[data-theme=blue] .panel,[data-theme=blue] .sugg,[data-theme=gu] .panel,[data-theme=gu] .sugg{backdrop-filter:blur(6px)}
[data-theme=white] .panel,[data-theme=white] .sugg,[data-theme=white] .stat,[data-theme=white] .crow,[data-theme=white] .erow{box-shadow:0 2px 10px rgba(120,95,40,.08)}
[data-theme=white] .pip,[data-theme=white] .ms{box-shadow:inset 0 0 0 1px rgba(60,45,20,.35)}
[data-theme=white] h2{font-size:21px} [data-theme=white] h3{font-size:17px}
[data-theme=white] .scanstatus,[data-theme=white] .scantop .iconbtn{color:#ece6f5}
[data-theme=white] .sheet-back{background:rgba(60,45,20,.35)}
[data-theme=white] .overlay{background:rgba(245,239,225,.92)}
[data-theme=wb] h1,[data-theme=wb] h2,[data-theme=br] h1,[data-theme=br] h2,[data-theme=bg] h1,[data-theme=bg] h2{font-weight:700;letter-spacing:.03em}
/* Partikel */
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#fx i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;opacity:0;animation:var(--a) var(--d) var(--dl) infinite ease-in-out;will-change:transform,opacity}
#fx .k-sparkle{background:var(--gold-hi);box-shadow:0 0 6px 1px var(--gold);--a:twinkle}
#fx .k-fireflies{background:#eaff8f;box-shadow:0 0 10px 3px rgba(214,255,110,.55);--a:firefly}
#fx .k-embers{background:#ffb04a;box-shadow:0 0 6px 2px rgba(255,110,30,.7);border-radius:40%;--a:ember;top:auto;bottom:-12px}
#fx .k-bubbles{border:1.2px solid rgba(160,230,255,.55);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 55%);--a:bubble;top:auto;bottom:-24px}
#fx .k-ash{background:#8a837a;border-radius:2px;--a:ash;top:-12px}
#fx .k-motes{background:var(--gold-light);box-shadow:0 0 6px var(--gold);--a:mote}
#fx .k-leaves{width:calc(var(--s) * 1.6);border-radius:0 100% 0 100%;background:linear-gradient(135deg,#7bbf55,#3f7a35);--a:leaf;top:-20px;opacity:0}
#fx .k-rain{width:1px;height:calc(var(--s) * 6);border-radius:0;background:linear-gradient(transparent,rgba(170,230,230,.55));--a:rain;top:-60px;animation-timing-function:linear}
#fx .k-snow{background:rgba(200,240,235,.55);--a:ash;top:-12px}
#fx .k-spores{background:#d6f07a;box-shadow:0 0 8px 2px rgba(190,230,90,.5);--a:bubble;top:auto;bottom:-14px}
#fx .k-spores:nth-child(3n){background:#c7a6ff;box-shadow:0 0 8px 2px rgba(170,130,255,.45)}
#fx .k-sparks{background:#cfeaff;box-shadow:0 0 8px 2px rgba(87,184,255,.8);--a:spark}
#fx .k-sparks:nth-child(3n){background:#ffd0a0;box-shadow:0 0 8px 2px rgba(255,120,60,.8)}
#fx .k-cells{border:1px solid rgba(95,227,176,.45);background:radial-gradient(circle at 60% 40%,rgba(95,227,176,.35) 0 18%,transparent 20%),rgba(95,227,176,.06);--a:mote}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.7;transform:scale(1)}}
@keyframes firefly{0%{opacity:0;transform:translate(0,0)}20%{opacity:.95}50%{opacity:.25;transform:translate(var(--dx),var(--dy))}75%{opacity:.9}100%{opacity:0;transform:translate(calc(var(--dx) * -.6),calc(var(--dy) * 1.4))}}
@keyframes ember{0%{opacity:0;transform:translate(0,0) scale(1)}10%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),-105vh) scale(.3)}}
@keyframes bubble{0%{opacity:0;transform:translate(0,0)}10%{opacity:.8}50%{transform:translate(var(--dx),-55vh)}100%{opacity:0;transform:translate(calc(var(--dx) * -.4),-110vh)}}
@keyframes ash{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.55}100%{opacity:0;transform:translate(var(--dx),105vh) rotate(540deg)}}
@keyframes mote{0%,100%{opacity:0;transform:translate(0,0)}40%{opacity:.85}60%{opacity:.6;transform:translate(var(--dx),var(--dy))}}
@keyframes leaf{0%{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:.85}50%{transform:translate(calc(var(--dx) * -.5),52vh) rotate(260deg)}100%{opacity:0;transform:translate(var(--dx),108vh) rotate(560deg)}}
@keyframes rain{0%{opacity:0;transform:translate(0,0)}8%{opacity:.7}100%{opacity:.2;transform:translate(var(--dx),112vh)}}
@keyframes spark{0%,60%,100%{opacity:0;transform:translate(0,0) scale(.6)}62%{opacity:1;transform:translate(0,0) scale(1)}75%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
@media (prefers-reduced-motion:reduce){#fx{display:none}}
body.no-fx #fx{display:none}
/* Deck-Ansicht in Deckfarben */
.sheet.full[data-theme]{position:relative;background:var(--deco-l) left top/52px auto repeat-y,var(--deco-r) right top/52px auto repeat-y,var(--deck2,linear-gradient(transparent,transparent)),var(--bg-img),radial-gradient(1000px 520px at 50% -160px,var(--glow) 0%,transparent 60%),var(--bg)}
.sheet.full[data-theme] .shead{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px)}
.deckart{position:absolute;left:-16px;right:-16px;top:calc(-8px - env(safe-area-inset-top,0px));height:320px;background:var(--hero) center 25%/cover no-repeat;filter:var(--art-filter);opacity:.5;-webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent);pointer-events:none;z-index:0}
.sheet.full .sbody{position:relative;z-index:1}
.sheet.full .sbody>:not(.deckart):not(.shead){position:relative;z-index:1}
.artcredit{font-size:10.5px;color:var(--dim);text-align:right;margin:-2px 2px 6px}
/* Design-Auswahl */
.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themecard{position:relative;border-radius:var(--radius);border:2px solid var(--line);padding:12px;min-height:104px;cursor:pointer;overflow:hidden;background:var(--deco-bot) center bottom/170% auto no-repeat,var(--bg-img),radial-gradient(300px 160px at 50% -60px,var(--glow),transparent 70%),var(--bg);text-align:left;font:inherit;color:var(--text)}
.themecard.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-bg)}
.themecard b{display:block;font-family:var(--font-head);font-size:16px;overflow-wrap:anywhere;color:var(--gold-hi);font-weight:400;padding-right:30px;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.6)}
[data-theme=white].themecard b{text-shadow:none}
.themecard .orn{position:absolute;right:10px;top:10px;width:26px;height:26px;background:var(--orn) center/contain no-repeat}
.themecard .sw{display:flex;gap:5px;margin-top:10px}
.themecard .sw i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line)}
.themecard small{display:block;color:var(--muted);font-size:11.5px;margin-top:6px;line-height:1.3}
.themehead{margin:14px 2px 8px;font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-family:Inter,system-ui,sans-serif}

header.top{transition:background .25s}
body.scrolled header.top{background:linear-gradient(color-mix(in srgb,var(--bg) 95%,transparent) 70%,transparent)}

/* Platz, damit die letzte Zeile über den unteren Rand scrollen kann */
main{padding-bottom:calc(var(--nav) + var(--safe-b) + 96px)}
/* Rahmen hinter dem Inhalt (Pilzwald: Baumstämme) + kleine Rand-Details */
#frame{position:fixed;inset:0;z-index:0;pointer-events:none}
#frame svg{position:absolute;top:env(safe-area-inset-top,0px);bottom:calc(var(--nav) + var(--safe-b));height:calc(100% - var(--nav) - var(--safe-b) - env(safe-area-inset-top,0px));width:46px}
#frame .fr-l{left:0}
#frame .fr-r{right:0}
@media(min-width:700px){#frame svg{width:64px}}
#decoAnim svg.da-s{left:auto;margin:0;height:auto}
#decoAnim svg.da-s.l{-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
#decoAnim svg.da-s.r{-webkit-mask-image:linear-gradient(270deg,#000 55%,transparent);mask-image:linear-gradient(270deg,#000 55%,transparent)}
html[data-theme=green] #deco{display:none}
html[data-theme=green] #decoAnim{opacity:.95;-webkit-mask-image:radial-gradient(ellipse 58% 68% at 50% 48%,transparent 55%,#000 80%);mask-image:radial-gradient(ellipse 58% 68% at 50% 48%,transparent 55%,#000 80%)}
body.scrolled #frame{opacity:.8}
body:has(.sheet-back) #frame{opacity:.35}
#decoAnim .a-leaf{transform-box:view-box;transform-origin:var(--o,50% 0);animation-name:dleaf}
#decoAnim .a-fly{animation-name:dfly}
#decoAnim .a-fly.rev{animation-direction:reverse}
@keyframes dleaf{0%,100%{transform:rotate(-5deg)}30%{transform:rotate(7deg)}55%{transform:rotate(-1deg)}78%{transform:rotate(5deg)}}
@keyframes dfly{0%,100%{transform:translate(0,0)}20%{transform:translate(10px,-12px)}45%{transform:translate(2px,-26px)}70%{transform:translate(-8px,-10px)}85%{transform:translate(4px,4px)}}

/* THEMES-END */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{background:var(--bg-img),radial-gradient(1200px 600px at 50% -200px,var(--glow) 0%,transparent 60%),var(--bg);background-attachment:fixed;overscroll-behavior-y:contain;transition:background-color .3s}
h1,h2,h3{font-family:var(--font-head);letter-spacing:var(--head-ls);margin:0;font-weight:700;text-shadow:var(--head-shadow)}
h3{font-family:var(--font-sub);text-transform:var(--sub-transform)}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
.hidden{display:none!important}

/* Header */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:linear-gradient(var(--bg) 40%,transparent);background:linear-gradient(color-mix(in srgb,var(--bg) 82%,transparent) 30%,transparent)}
header.top .logo{width:30px;height:30px;border-radius:8px}
header.top .orn{width:28px;height:28px;background:var(--orn) center/contain no-repeat;flex:none}
header.top h1{flex:1;text-shadow:none;background:linear-gradient(90deg,var(--gold-hi),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
main{padding:0 16px calc(var(--nav) + var(--safe-b) + 24px);max-width:900px;margin:0 auto}

/* Bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--nav-bg);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
nav.bottom button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11.5px;font-weight:600;cursor:pointer}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.active{color:var(--gold)}

/* Generic */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary-bg);color:var(--gold-ink);border-color:var(--gold-light)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger-line);background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
label.field{display:block;margin:10px 0}
label.field>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--gold2)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--gold);box-shadow:0 0 0 1px var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.chip.warn{color:var(--warn);border-color:var(--warn-line)}
.chip.bad{color:var(--danger);border-color:var(--danger-line)}
.chip.good{color:var(--ok);border-color:var(--ok-line)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--bg2);border:1px solid var(--line);border-radius:999px;transition:.2s}
.switch span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:var(--dim);border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--gold-bg);border-color:var(--gold2)}
.switch input:checked+span:before{transform:translateX(20px);background:var(--gold)}

/* Mana */
.mana{display:inline-flex;gap:2px;vertical-align:middle;flex-wrap:nowrap}
.ms{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10.5px;font-weight:800;color:#1b1b1b;background:var(--C);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
.ms.W{background:var(--W)} .ms.U{background:var(--U);color:#fff} .ms.B{background:#8f8296;color:#140f17} .ms.R{background:var(--R);color:#fff} .ms.G{background:var(--G);color:#fff}
.ms.big{width:34px;height:34px;font-size:15px}
.pip{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
.pip.W{background:var(--W)} .pip.U{background:var(--U)} .pip.B{background:#8f8296} .pip.R{background:var(--R)} .pip.G{background:var(--G)} .pip.C{background:var(--C)}

/* Color picker */
.colorpick{display:flex;justify-content:space-between;gap:8px}
.colorpick button{flex:1;aspect-ratio:1;max-width:60px;border-radius:50%;border:2px solid transparent;cursor:pointer;font-family:var(--font-head);font-weight:700;font-size:18px;opacity:.38;transition:.15s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.colorpick button.on{opacity:1;border-color:var(--gold);transform:scale(1.06)}
.colorpick .W{background:var(--W);color:#3b3420} .colorpick .U{background:var(--U);color:#fff} .colorpick .B{background:#4a3f52;color:#e8dff0} .colorpick .R{background:var(--R);color:#fff} .colorpick .G{background:var(--G);color:#fff}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-family:var(--font-sub);color:var(--gold)}
.stat span{font-size:11.5px;color:var(--muted)}

/* Collection grid */
.toolbar{display:flex;gap:8px;margin:10px 0;align-items:center}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip.on{border-color:var(--gold2);color:var(--gold);background:var(--gold-bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;border-radius:9px;overflow:hidden;background:var(--card);aspect-ratio:488/680;cursor:pointer;border:1px solid var(--line)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .qty{position:absolute;right:5px;top:5px;background:var(--badge-bg);color:var(--gold);font-weight:800;font-size:12px;border-radius:8px;padding:2px 7px;border:1px solid var(--gold2)}
.tile .foil{position:absolute;left:5px;top:5px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:7px;background:linear-gradient(90deg,#f6a,#fd6,#6ef,#a7f);color:#111}
.ph{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:8px;background:linear-gradient(160deg,var(--card2),var(--bg2));font-size:11.5px;font-weight:600}
.ph .t{font-family:var(--font-head);font-size:12px;line-height:1.2}

/* Empty state */
.empty{text-align:center;padding:30px 10px}
.empty .art{width:110px;height:110px;margin:0 auto 14px;opacity:.95}
.empty p{color:var(--muted);max-width:420px;margin:8px auto 18px}
ol.how{text-align:left;color:var(--muted);max-width:420px;margin:0 auto;padding-left:22px}
ol.how li{margin:5px 0}

/* Suggestions */
.sugg{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:10px 0;cursor:pointer;position:relative;overflow:hidden}
.sugg:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stripe,var(--gold))}
.sugg .thumbs{display:flex;flex:none}
.sugg .thumbs img,.sugg .thumbs .phm{width:46px;height:64px;border-radius:5px;object-fit:cover;border:1px solid var(--line);background:var(--bg2)}
.sugg .thumbs img+img,.sugg .thumbs img+.phm,.sugg .thumbs .phm+img,.sugg .thumbs .phm+.phm{margin-left:-24px}
.sugg h3{margin-bottom:3px}
.bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold-hi))}

/* Sheet (modal) */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(5,3,8,.6);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{color:var(--text);width:100%;max-width:900px;max-height:92vh;max-height:min(92dvh,calc(100dvh - env(safe-area-inset-top,0px) - 16px));overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:8px 16px calc(24px + var(--safe-b));animation:up .2s ease-out}
/* Vollbild: an der sichtbaren Fläche ausrichten (100vh ist auf iOS größer als der sichtbare Bereich → oben abgeschnitten) */
.sheet-back.full-back{align-items:stretch}
.sheet.full{height:100%;max-height:100%;border-radius:0;border:0;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.ctl-bottom .sheet.full .shead{position:fixed;top:auto;bottom:0;left:0;right:0;padding:10px 16px calc(10px + var(--safe-b));border-top:1px solid var(--line);z-index:6}
body.ctl-bottom .sheet.full{padding-bottom:calc(84px + var(--safe-b))}
body.ctl-bottom .scantop{top:auto;bottom:58px}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet .shead{display:flex;align-items:center;gap:10px;position:sticky;top:-8px;background:var(--bg2);padding:8px 0;z-index:2}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Card detail */
.cardimg{width:100%;max-width:340px;display:block;margin:0 auto;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.oracle{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}

/* Deck view */
.curve{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.curve div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.curve i{display:block;width:100%;background:linear-gradient(180deg,var(--gold-hi),var(--gold2));border-radius:5px 5px 2px 2px;min-height:2px}
.curve b{font-size:11px;color:var(--muted)}
.curve em{font-style:normal;font-size:11px;color:var(--text);font-weight:700}
.group h3{margin:16px 0 6px;color:var(--gold);display:flex;justify-content:space-between}
.crow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:5px 0;cursor:pointer}
.crow .n{font-weight:800;color:var(--gold);width:24px;text-align:right;flex:none}
.crow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.crow.conflict{border-color:var(--warn-line)}
.crow .qbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font-weight:800;cursor:pointer;flex:none}
.ai-box{background:linear-gradient(160deg,var(--ai-bg1),var(--ai-bg2));border:1px solid var(--ai-line);border-radius:var(--radius);padding:14px;margin:12px 0}
.ai-box h3{color:var(--ai)}
.ai-box ul{margin:6px 0;padding-left:20px}
.swap{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.2);border-radius:10px;padding:8px 10px;margin:6px 0}

/* Overlay + toast */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(8,6,12,.82);display:flex;align-items:center;justify-content:center;padding:30px}
.overlay .box{width:100%;max-width:380px;text-align:center}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--safe-b) + 14px);z-index:90;background:var(--card2);border:1px solid var(--gold2);padding:11px 16px;border-radius:12px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:up .2s}
.list-plain{margin:0;padding-left:18px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}

/* v0.2: Ordner, Sets, Auswahl, Kartenansicht */
.tile.selected{outline:3px solid var(--gold);outline-offset:-3px}
.tile .check{position:absolute;left:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:rgba(10,8,14,.8);border:2px solid var(--gold);color:var(--gold);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.tile.selected .check{background:var(--gold);color:var(--gold-ink)}
.selbar{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + var(--safe-b) + 8px);z-index:40;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--gold2);border-radius:14px;padding:8px 10px 8px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:880px;margin:0 auto;animation:up .2s}
.frow{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer}
.ficon{font-size:18px}
.seticon{width:22px;height:22px;filter:var(--seticon-filter);flex:none}
.erow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin:5px 0}
.erow .qbtn,.row .qbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);font-weight:800;cursor:pointer;flex:none}
.linkbtn{background:none;border:0;color:var(--gold);padding:4px 0 0;font-size:12.5px;cursor:pointer;text-align:left}
.iconbtn:disabled{opacity:.3}
.slide-l{animation:slidel .18s ease-out}.slide-r{animation:slider .18s ease-out}
@keyframes slidel{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slider{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.sugg .iconbtn{align-self:center;font-size:18px}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + var(--safe-b) + 18px);z-index:35;width:60px;height:60px;border-radius:50%;border:1px solid var(--gold-light);background:var(--primary-bg);font-size:26px;box-shadow:0 8px 24px rgba(0,0,0,.55);cursor:pointer}
body:has(#selbar) .fab{display:none}
.scanwrap{position:relative;width:100%;height:58vh;min-height:320px;background:#000;border-radius:16px;overflow:hidden;margin-top:4px}
.scanwrap video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;border:3px solid var(--gold);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);pointer-events:none}
.scanframe .nb,.scanframe .ib{position:absolute;border:1.5px dashed rgba(243,223,168,.7);border-radius:4px}
.scanframe .nb{left:5%;top:3%;width:75%;height:7.5%}
.scanframe .ib{left:2.5%;top:88.5%;width:63.5%;height:10%}
.scantop{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px}
.scantop .iconbtn{background:rgba(20,15,28,.75)}
.scantop .iconbtn.on{border-color:var(--gold);background:var(--gold-bg)}
.scanstatus{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(15,12,20,.85);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.scanstatus.ok{border-color:var(--ok-line);color:var(--ok)}
.scanstatus.warn{border-color:var(--warn-line);color:var(--warn)}
.scanctl{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.scopehead{display:flex;align-items:center;gap:10px;margin-top:12px}
.scopehead h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1>Manaforge</h1>
  <span class="orn" aria-hidden="true"></span>
  <span id="hdrInfo" class="tiny muted"></span>
</header>
<div id="art" aria-hidden="true"></div>
<div id="frame" aria-hidden="true"></div>
<div id="deco" aria-hidden="true"></div>
<div id="decoAnim" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<main id="main"></main>
<nav class="bottom" id="nav">
  <button data-view="collection" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="11" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/></svg>Sammlung</button>
  <button data-view="build">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.6 6.3L21 9l-5 4.3L17.5 20 12 16.6 6.5 20 8 13.3 3 9l6.4-.7z"/></svg>Deckbau</button>
  <button data-view="decks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="7" width="13" height="14" rx="2"/><path d="M7 4h11a2 2 0 0 1 2 2v12"/></svg>Decks</button>
  <button data-view="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</button>
</nav>
<input type="file" id="csvInput" accept=".csv,text/csv,text/comma-separated-values,text/plain,application/vnd.ms-excel,*/*" class="hidden">
<input type="file" id="jsonInput" accept=".json,application/json,*/*" class="hidden">
<script src="app.js"></script>
</body>
</html>
